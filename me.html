.list a{display:grid;grid-template-columns:72px 1fr;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin-bottom:8px;text-decoration:none;color:#111}
.list img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:#eee}.list .t{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.list .m{font-size:12px;color:#6b7280;margin-top:4px}
.disc{font-size:11px;color:#6b7280;margin-top:18px;line-height:1.5}.ft{text-align:center;font-size:12px;color:#6b7280;margin-top:14px}.ft a{color:#0f2a4a;font-weight:700;text-decoration:none}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.links a{flex:1;min-width:120px;text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 8px;text-decoration:none;color:#0f2a4a;font-weight:700;font-size:14px}
.search{width:100%;border:1px solid #e5e7eb;border-radius:12px;padding:13px 14px;font-size:17px;margin:0 0 10px;background:#fff}
.nos{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.nos a{min-width:48px;text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:9px 6px;text-decoration:none;color:#0f2a4a;font-weight:800;font-size:15px}

<h1>탬디그 오늘의 특가</h1><p class="tag">영상 끝에 나온 <b>번호</b>를 누르거나, 상품명을 검색하세요</p>
<div class="links"><a href="index.html">⚡ 오늘의 특가 전체</a></div>
<input class="search" id="q" placeholder="번호 또는 상품명 (예: 17, 오메가3)" inputmode="search" autocomplete="off">
<div class="nos" id="nos"></div>
<div class="list" id="list"></div>
<p class="disc">이 페이지의 링크는 토스 쉐어링크 활동의 일환으로, 구매 시 일정액의 수수료를 받을 수 있습니다. 가격·할인율은 토스쇼핑 기준이며 수시로 바뀔 수 있어요.</p><p class="ft">© 탬디그 오늘의 특가</p></div>
<script>
const D=[{"no": 22, "nm": "오뚝이형 스탠딩 밥주걱", "img": "https://langpoon.github.io/temdig-deals/s/22.jpg", "price": null, "url": "https://link.coupang.com/a/hSal29JNcW"}, {"no": 4, "nm": "2만 원으로 고급차 옵션 완성? 차 문 쾅 닫힘 방지하는 역대급 꿀템", "img": "https://i.ytimg.com/vi/9CF9dmOKAhI/hqdefault.jpg", "price": null, "url": "https://detail.tmall.com/item.htm?abbucket=10&id=656239693116&mi_id=0000r5PR2wtiP-p1PdOzJZ2_Knmemx534gr_2MPOwSYQGPE&ns=1&priceTId=2100c82017919531454592678e0a2a&skuId=4907573610022&spm=a21n57.imgsearch.item.3&utparam=%7B%22aplus_abtest%22%3A%2297ab6a23cde676244f878fef132ec3e4%22%7D&xxc=taobaoSearch"}, {"no": 3, "nm": "천원으로 매듭 고수가 되다", "img": "https://i.ytimg.com/vi/UDWVt9sLD6o/hqdefault.jpg", "price": null, "url": "https://item.taobao.com/item.htm?abbucket=10&id=900249480492&mi_id=0000x-vwYLhfoCTkWTqVvghyk4D06NJW1XWEXY6TAG6T4qY&ns=1&priceTId=2100c84717919527846783343e0a3c&skuId=5922817027223&spm=a21n57.imgsearch.item.2&utparam=%7B%22aplus_abtest%22%3A%2254852913d45794e3c42eada7b286be37%22%7D&xxc=taobaoSearch"}, {"no": 2, "nm": "32-35mm 트러스 튜브파이프용 아이볼트가 장착된 Pelopy 2 중장비용 1.25인치 클램프 LED 비디오 월 및 조명 장착용 알루미늄 스테이지 라이트 48-51mm|Black", "img": "https://thumbnail.coupangcdn.com/thumbnails/remote/640x640ex/image/vendor_inventory/1988/7b8e40c8754ca8454888a6f6ace2a604d15bf660da905906a5d6bbfd656b.jpg", "price": 64880, "url": "https://www.coupang.com/vp/products/9697921510?itemId=29008918745"}, {"no": 1, "nm": "Kdo 튼튼한 스테인리스 식기 건조대", "img": "https://thumbnail.coupangcdn.com/thumbnails/remote/640x640ex/image/vendor_inventory/5326/6bc918ce55015db6aea16828d68a72a32f47f03bc5af79385ffa08ddae48.png", "price": 41600, "url": "https://www.coupang.com/vp/products/9262037925"}];
const won=n=>n?Number(n).toLocaleString()+'원':'';
function render(q){
  q=(q||'').trim().toLowerCase();
  const arr=D.filter(x=>!q||String(x.no)===String(Number(q))||x.nm.toLowerCase().includes(q));
  document.getElementById('nos').innerHTML=q?'':D.slice(0,24).map(x=>`<a href="s/${x.no}.html">${x.no}</a>`).join('');
  document.getElementById('list').innerHTML=arr.length?arr.map(x=>`<a href="s/${x.no}.html"><img src="${x.img}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.style.visibility='hidden'"><div><div class="t">[${x.no}번] ${x.nm}</div><div class="m">${won(x.price)}</div><span class="go">상품 보기 →</span></div></a>`).join(''):'<p class="sub">찾는 상품이 없어요</p>';
}
document.getElementById('q').oninput=e=>render(e.target.value);
const h=location.hash.replace('#','');if(h){document.getElementById('q').value=h;}render(h);
</script></body></html>
