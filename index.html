  if(F==='deal'&&!arr.length&&!Q){F='all';document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x.dataset.f==='all'));return render();}
  document.getElementById('cnt').textContent=arr.length+'개';
  document.getElementById('list').innerHTML=arr.length?arr.map(p=>`<a class="card" href="${p.url}" target="_blank" rel="nofollow sponsored">${p.deal?`<span class="badge deal">⚡ 특가${p.end?' ~'+p.end:''}</span>`:(p.disc>=70?`<span class="badge">${p.disc}%↓</span>`:'')}<img src="${p.img}" loading="lazy" alt=""><div><p class="nm">${p.name}</p><div class="pr"><b>${won(p.price)}</b>${p.disc?`<span class="d">${p.disc}%</span>`:''}${p.orig?`<s>${won(p.orig)}</s>`:''}</div><div class="rv">${p.rating?`★ ${p.rating}`:''}${p.reviews?` (${Number(p.reviews).toLocaleString()})`:''}${p.rank?` · 베스트 ${p.rank}위`:''}</div><span class="go">구매하러 가기 →</span></div></a>`).join(''):'<div class="empty">조건에 맞는 상품이 없어요</div>';
}
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bar button').forEach(x=>x.classList.remove('on'));b.classList.add('on');F=b.dataset.f;render()});
document.getElementById('q').oninput=e=>{Q=e.target.value.trim().toLowerCase();render()};
render();
</script></body></html>
